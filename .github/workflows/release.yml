name: ADLC Release

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing immutable vX.Y.Z tag to prepare or publish
        required: true
        type: string
      confirm_publication:
        description: Request protected external publication jobs
        required: true
        default: false
        type: boolean
      approval_record_json:
        description: Human release_publication approval record bound to the dry-run packet SHA-256
        required: false
        default: ""
        type: string
      approval_packet_run_id:
        description: Successful preparation-only workflow run containing the exact approved candidate artifact
        required: false
        default: ""
        type: string

permissions:
  actions: read
  contents: read

concurrency:
  group: adlc-release-${{ inputs.release_tag }}
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      packet_sha256: ${{ steps.packet.outputs.packet_sha256 }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_tag }}
          fetch-depth: 0
      - name: Verify immutable tag checkout
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          git show-ref --verify --quiet "refs/tags/$RELEASE_TAG"
          test "$(git rev-parse HEAD)" = "$(git rev-parse "refs/tags/$RELEASE_TAG^{commit}")"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install preparation dependencies
        if: ${{ !inputs.confirm_publication }}
        run: |
          python -m pip install --upgrade pip
          python -m pip install 'jsonschema>=4,<5' 'pytest>=7,<9' 'ruff>=0.5,<1' 'mkdocs==1.6.1' 'mkdocs-material==9.7.6'
          sudo apt-get update
          sudo apt-get install -y jq ripgrep
      - name: Prepare reproducible approval packet
        if: ${{ !inputs.confirm_publication }}
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: python scripts/release.py prepare --tag "$RELEASE_TAG" --repository pypi --verify-reproducible --rehearse-rollback --json
      - name: Require an exact previously prepared candidate
        if: ${{ inputs.confirm_publication }}
        env:
          APPROVAL_PACKET_RUN_ID: ${{ inputs.approval_packet_run_id }}
        run: test -n "$APPROVAL_PACKET_RUN_ID"
      - name: Reuse the exact packet-approved candidate
        if: ${{ inputs.confirm_publication }}
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: ${{ inputs.approval_packet_run_id }}
          name: release-candidate-${{ inputs.release_tag }}
          path: release-out/${{ inputs.release_tag }}
      - name: Verify reused candidate identity
        if: ${{ inputs.confirm_publication }}
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          PACKET="release-out/$RELEASE_TAG/release-approval-packet.json"
          test -f "$PACKET"
          PACKET="$PACKET" RELEASE_COMMIT="$(git rev-parse HEAD)" python - <<'PY'
          import json
          import os
          from pathlib import Path

          packet = json.loads(Path(os.environ["PACKET"]).read_text(encoding="utf-8"))
          assert packet["release"]["tag"] == os.environ["RELEASE_TAG"]
          assert packet["release"]["repository"] == "pypi"
          assert packet["source"]["commit"] == os.environ["RELEASE_COMMIT"]
          PY
      - name: Export packet digest
        id: packet
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: echo "packet_sha256=$(sha256sum "release-out/$RELEASE_TAG/release-approval-packet.json" | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: release-candidate-${{ inputs.release_tag }}
          path: release-out/${{ inputs.release_tag }}

  publish-pypi:
    if: inputs.confirm_publication
    needs: prepare
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      actions: read
      id-token: write
      attestations: write
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_tag }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install approval validator dependency
        run: python -m pip install 'jsonschema>=4,<5'
      - uses: actions/download-artifact@v4
        with:
          name: release-candidate-${{ inputs.release_tag }}
          path: release-out/${{ inputs.release_tag }}
      - name: Validate packet-bound human approval
        env:
          APPROVAL_RECORD_JSON: ${{ inputs.approval_record_json }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          test -n "$APPROVAL_RECORD_JSON"
          printf '%s' "$APPROVAL_RECORD_JSON" > "$RUNNER_TEMP/release-approval.json"
          python scripts/release.py publish --packet "release-out/$RELEASE_TAG/release-approval-packet.json" --approval-record "$RUNNER_TEMP/release-approval.json" --target pypi_upload --confirm-external-publication --json
      - uses: actions/attest-build-provenance@v2
        with:
          subject-path: release-out/${{ inputs.release_tag }}/artifacts/*
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: release-out/${{ inputs.release_tag }}/artifacts/

  github-release:
    if: inputs.confirm_publication
    needs: [prepare, publish-pypi]
    runs-on: ubuntu-latest
    environment: github-release
    permissions:
      actions: read
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_tag }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install approval validator dependency
        run: python -m pip install 'jsonschema>=4,<5'
      - uses: actions/download-artifact@v4
        with:
          name: release-candidate-${{ inputs.release_tag }}
          path: release-out/${{ inputs.release_tag }}
      - name: Validate packet-bound human approval
        env:
          APPROVAL_RECORD_JSON: ${{ inputs.approval_record_json }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          test -n "$APPROVAL_RECORD_JSON"
          printf '%s' "$APPROVAL_RECORD_JSON" > "$RUNNER_TEMP/release-approval.json"
          python scripts/release.py publish --packet "release-out/$RELEASE_TAG/release-approval-packet.json" --approval-record "$RUNNER_TEMP/release-approval.json" --target github_release --confirm-external-publication --json
      - name: Create immutable GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          NOTES_FILE="docs/release/$RELEASE_TAG.md"
          test -f "$NOTES_FILE"
          gh release create "$RELEASE_TAG" release-out/$RELEASE_TAG/artifacts/* --verify-tag --title "ADLC $RELEASE_TAG" --notes-file "$NOTES_FILE"

  pages:
    if: inputs.confirm_publication
    needs: github-release
    runs-on: ubuntu-latest
    environment: github-pages
    permissions:
      actions: read
      pages: write
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_tag }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install approval validator dependency
        run: python -m pip install 'jsonschema>=4,<5'
      - uses: actions/download-artifact@v4
        with:
          name: release-candidate-${{ inputs.release_tag }}
          path: release-out/${{ inputs.release_tag }}
      - name: Validate packet-bound human approval
        env:
          APPROVAL_RECORD_JSON: ${{ inputs.approval_record_json }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          test -n "$APPROVAL_RECORD_JSON"
          printf '%s' "$APPROVAL_RECORD_JSON" > "$RUNNER_TEMP/release-approval.json"
          python scripts/release.py publish --packet "release-out/$RELEASE_TAG/release-approval-packet.json" --approval-record "$RUNNER_TEMP/release-approval.json" --target pages_deploy --confirm-external-publication --json
      - name: Build the approved tagged documentation
        run: |
          python -m pip install '.[docs]'
          python scripts/check_docs_release.py --tag "${{ inputs.release_tag }}" --json
          mkdocs build --strict
          python tests/check_built_docs.py site
          python -m playwright install --with-deps chromium
          python tests/check_docs_viewports.py site docs-preview
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - name: Deploy packet-approved Pages artifact
        id: deployment
        uses: actions/deploy-pages@v4
