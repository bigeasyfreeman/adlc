name: ADLC Docs

on:
  pull_request:
    paths:
      - "docs/**"
      - "benchmarks/**"
      - "examples/fix-demo/**"
      - "mkdocs.yml"
      - "pyproject.toml"
      - "scripts/check_docs_release.py"
      - "scripts/render_support_matrix.py"
      - "scripts/release.py"
      - "tests/test_release_workflow.py"
      - ".github/workflows/release.yml"
      - "tests/check_built_docs.py"
      - "tests/check_docs_viewports.py"
      - ".github/workflows/docs.yml"
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: adlc-docs-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Install documentation dependencies
        run: python -m pip install '.[docs]'
      - name: Validate release and documentation versions
        if: github.event_name != 'pull_request'
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          git show-ref --verify --quiet "refs/tags/$RELEASE_TAG"
          test "$(git rev-parse HEAD)" = "$(git rev-parse "refs/tags/$RELEASE_TAG^{commit}")"
          python scripts/check_docs_release.py --tag "$RELEASE_TAG" --json
      - name: Strict build
        run: mkdocs build --strict
      - name: Rendered site contract
        run: python tests/check_built_docs.py site
      - name: Install Chromium for responsive rendering
        run: python -m playwright install --with-deps chromium
      - name: Desktop and mobile render contract
        run: python tests/check_docs_viewports.py site docs-preview
      - uses: actions/upload-artifact@v4
        with:
          name: docs-preview-${{ github.sha }}
          path: docs-preview
