name: ADLC CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: adlc-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install 'jsonschema>=4,<5' 'pytest>=7,<9' 'ruff>=0.5,<1'
          sudo apt-get update
          sudo apt-get install -y jq ripgrep
      - name: Run ADLC CI
        run: bin/adlc ci --json
      - name: Run benchmark architecture contract
        run: python -m pytest tests/test_benchmark_contract.py -q
      - name: Run release architecture contract
        run: python -m pytest tests/test_release_workflow.py -q
      - name: Run Python lint
        run: ruff check scripts tests benchmarks examples/fix-demo
