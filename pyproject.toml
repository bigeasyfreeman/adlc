[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "adlc"
version = "0.1.0"
description = "Agentic Development Lifecycle contracts, schemas, runtime adapters, and deterministic validators."
readme = "README.md"
license = {file = "LICENSE"}
authors = [
  {name = "Eric Freeman"}
]
requires-python = ">=3.9"
dependencies = [
  "jsonschema>=4.0,<5.0"
]

[project.scripts]
adlc-skill = "adlc_runtime.install:main"

[project.optional-dependencies]
pdf = [
  "PyMuPDF>=1.24,<2.0"
]
audit = [
  "pip-audit>=2.7",
  "radon>=6",
  "ruff>=0.5",
  "vulture>=2.11",
  "mypy>=1.10"
]

[project.urls]
Homepage = "https://github.com/bigeasyfreeman/adlc"
Repository = "https://github.com/bigeasyfreeman/adlc"
Issues = "https://github.com/bigeasyfreeman/adlc/issues"
Changelog = "https://github.com/bigeasyfreeman/adlc/blob/main/CHANGELOG.md"

[tool.ruff]
line-length = 120
target-version = "py39"

[tool.setuptools.packages.find]
where = ["scripts"]
include = ["adlc_runtime*"]

[tool.setuptools.data-files]
"share/adlc/skill" = ["skill/SKILL.src.md"]
"share/adlc/skill/reference" = ["skill/reference/*.md"]
"share/adlc/skill/scripts" = ["skill/scripts/*.py"]
"share/adlc/skill/loops" = ["skill/loops/*.json"]
"share/adlc/schemas" = ["docs/schemas/install-manifest.schema.json", "docs/schemas/skill-behavior-report.schema.json"]
